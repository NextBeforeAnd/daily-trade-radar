name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install -e "./skill/daily-trade-radar[docx,dev]"
      - name: Lint
        run: ruff check .
      - name: Smoke-test installed CLI
        run: daily-trade-radar --help
      - name: Smoke-test documented validation example
        run: daily-trade-radar validate examples/current.json --require-language zh-CN
      - name: Run offline workflow tests with coverage
        run: coverage run -m unittest discover -s tests -v
      - name: Combine subprocess coverage
        run: coverage combine
      - name: Enforce coverage floor
        run: coverage report --fail-under=77
      - name: Build HTML coverage report
        if: always()
        run: coverage html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-python-${{ matrix.python-version }}
          path: htmlcov/
      - name: Exercise deterministic evaluation gate
        run: >-
          daily-trade-radar evaluate examples/current.json examples/evaluation-labels.json
          --allow-draft --minimum-positive-events 2 --min-deduplication-accuracy 0
