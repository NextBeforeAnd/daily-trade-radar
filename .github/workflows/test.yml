name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and document dependency
        run: python -m pip install -e "./skill/daily-trade-radar[docx]"
      - name: Smoke-test installed CLI
        run: daily-trade-radar --help
      - name: Run offline workflow tests
        run: python -m unittest discover -s tests -v
