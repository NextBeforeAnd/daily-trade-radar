[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-trade-radar"
version = "0.5.1"
description = "Auditable foreign-trade radar workflow for Codex and the standalone Python CLI."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
s3 = ["boto3>=1.36,<2"]
dev = ["coverage[toml]>=7.6,<8", "ruff>=0.6,<1"]

[project.scripts]
daily-trade-radar = "daily_trade_radar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_trade_radar = ["platforms/data/*.json", "official_sources/data/*.json"]
